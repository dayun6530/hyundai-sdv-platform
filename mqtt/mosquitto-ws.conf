per_listener_settings true

# Dedicated broker ports for this repo (avoid clashing with system mosquitto:1883)
# Bind explicitly to localhost to ensure Windows<->WSL localhost forwarding works reliably.
listener 1884 127.0.0.1
protocol mqtt
allow_anonymous true

# MQTT over WebSocket (for browser)
# NOTE: Windows has something already bound to 9001 (PID 4), so we use 9002.
listener 9002 127.0.0.1
protocol websockets
allow_anonymous true

persistence false

log_type all
connection_messages true

