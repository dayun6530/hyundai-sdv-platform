services:
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: sdv-mosquitto
    ports:
      - '1884:1883' # MQTT TCP
      - '9001:9001' # MQTT over WebSocket
    volumes:
      - ./mqtt/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    restart: unless-stopped

  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    container_name: sdv-otel-collector
    depends_on:
      - loki
    ports:
      - '4317:4317'
      - '4318:4318'
    volumes:
      - ./otel-collector-config.yaml:/etc/otelcol-contrib/config.yaml:ro
    restart: unless-stopped

  loki:
    image: grafana/loki:latest
    container_name: sdv-loki
    ports:
      - '3100:3100'
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: sdv-grafana
    depends_on:
      - loki
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
    ports:
      - '3000:3000'
    volumes:
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - grafana_data:/var/lib/grafana
    restart: unless-stopped

  postgres:
    image: postgres:15
    container_name: sdv-unleash-postgres
    environment:
      POSTGRES_DB: unleash
      POSTGRES_USER: unleash
      POSTGRES_PASSWORD: unleash
    # Unleash reaches this as postgres:5432 on the Compose network (no host publish; avoids WSL port-forward 500 errors).
    volumes:
      - unleash_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U unleash -d unleash']
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  unleash:
    image: unleashorg/unleash-server:latest
    container_name: sdv-unleash
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://unleash:unleash@postgres:5432/unleash
      DATABASE_SSL: 'false'
      LOG_LEVEL: warn
      # First-run admin credentials (you can change later in UI).
      UNLEASH_DEFAULT_ADMIN_USERNAME: admin
      UNLEASH_DEFAULT_ADMIN_PASSWORD: admin
    ports:
      - '4242:4242'
    restart: unless-stopped

  # Operational data store (Shadow / Kill Switch / telemetry) — separate from Unleash Postgres.
  operational-postgres:
    image: postgres:16-alpine
    container_name: sdv-operational-postgres
    environment:
      POSTGRES_DB: sdv_operational
      POSTGRES_USER: sdv
      POSTGRES_PASSWORD: sdv
    ports:
      - '5435:5432'
    # DB is reachable on the Compose network as operational-postgres:5432 (no host publish; avoids port clashes).
    volumes:
      - operational_pgdata:/var/lib/postgresql/data
      - ./sdv-operational-data/db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U sdv -d sdv_operational']
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  operational-data-api:
    build:
      context: ./sdv-operational-data/api
      dockerfile: Dockerfile
    container_name: sdv-operational-data-api
    depends_on:
      operational-postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://sdv:sdv@operational-postgres:5432/sdv_operational
      PORT: '8090'
    ports:
      - '8090:8090'
    restart: unless-stopped

  pgadmin:
    image: dpage/pgadmin4
    container_name: sdv-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
      # Pre-load Team_SDV_DB (operational-postgres on compose network); password in /pgpass.
      PGADMIN_SERVER_JSON_FILE: /pgadmin4/servers.json
    ports:
      - '5050:80'
    depends_on:
      - operational-postgres
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      - ./pgadmin/servers.json:/pgadmin4/servers.json:ro
      - ./pgadmin/pgpass:/pgpass:ro
    restart: unless-stopped

volumes:
  unleash_pgdata:
  grafana_data:
  operational_pgdata:
  pgadmin_data:
