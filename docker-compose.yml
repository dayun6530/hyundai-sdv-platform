services:
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: sdv-mosquitto
    ports:
      - "1884:1883"   # MQTT TCP
      - "9001:9001"   # MQTT over WebSocket
    volumes:
      - ./mqtt/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    restart: unless-stopped

  postgres:
    image: postgres:15
    container_name: sdv-unleash-postgres
    environment:
      POSTGRES_DB: unleash
      POSTGRES_USER: unleash
      POSTGRES_PASSWORD: unleash
    ports:
      - "5433:5432"
    volumes:
      - unleash_pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  unleash:
    image: unleashorg/unleash-server:latest
    container_name: sdv-unleash
    depends_on:
      - postgres
    environment:
      DATABASE_URL: postgres://unleash:unleash@postgres:5432/unleash
      DATABASE_SSL: "false"
      LOG_LEVEL: warn
      # First-run admin credentials (you can change later in UI).
      UNLEASH_DEFAULT_ADMIN_USERNAME: admin
      UNLEASH_DEFAULT_ADMIN_PASSWORD: admin
    ports:
      - "4242:4242"
    restart: unless-stopped

volumes:
  unleash_pgdata:

