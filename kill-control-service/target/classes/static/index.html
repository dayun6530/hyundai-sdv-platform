<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>시스템 제어 — KILL</title>
    <style>
        :root {
            font-family: system-ui, sans-serif;
            color: #1a1a1a;
            background: #f4f4f5;
        }
        body {
            max-width: 32rem;
            margin: 3rem auto;
            padding: 0 1rem;
        }
        h1 { font-size: 1.25rem; }
        p { color: #52525b; line-height: 1.5; }
        button {
            background: #b91c1c;
            color: #fff;
            border: none;
            padding: 0.65rem 1.25rem;
            border-radius: 6px;
            font-size: 1rem;
            cursor: pointer;
        }
        button:hover { background: #991b1b; }
        button:disabled { opacity: 0.6; cursor: not-allowed; }
        #status { margin-top: 1rem; font-size: 0.9rem; }
        .ok { color: #15803d; }
        .err { color: #b91c1c; }
    </style>
</head>
<body>
    <h1>프로세스 A / B 제어 (Web)</h1>
    <p>A/B 각각에 <code>KILL:AdasFeature</code> 같은 명령을 입력해 전송합니다. (기존처럼 A는 A만, B는 B만)</p>

    <!--
      전체 데이터 흐름 (주석):
      1) HTML: A/B 입력 + 버튼 클릭 → confirm("정말 종료 명령을 보내시겠습니까?")
      2) JS fetch: POST /api/system/kill (JSON: { car, command }) 비동기
      3) Controller: KillSignalEvent 발행 (직접 kill 없음)
      4) SignalReceiver @EventListener(@Async): 이벤트 수신
      5) SignalReceiver: car에 맞는 ExternalSignals_A.cmd / ExternalSignals_B.cmd에 "KILL:..." 기록
      6) (기존 플랫폼) FeatureEvaluator 등이 파일을 읽고 비우며 기존 graceful shutdown 로직 그대로 실행
    -->
    <div style="display:grid; gap: 1rem; margin-top: 1rem;">
        <section style="background:#fff; padding: 1rem; border-radius: 10px; box-shadow: 0 1px 4px rgba(0,0,0,0.08);">
            <h2 style="margin:0 0 .5rem 0; font-size: 1.05rem;">Car A</h2>
            <input id="cmdA" style="width:100%; padding:.6rem; border:1px solid #e4e4e7; border-radius:6px;"
                   placeholder="예) KILL:AdasFeature" />
            <div style="margin-top:.75rem; display:flex; gap:.5rem; align-items:center;">
                <button type="button" id="killA">Send KILL to A</button>
                <span id="statusA" style="font-size:.9rem;" aria-live="polite"></span>
            </div>
        </section>

        <section style="background:#fff; padding: 1rem; border-radius: 10px; box-shadow: 0 1px 4px rgba(0,0,0,0.08);">
            <h2 style="margin:0 0 .5rem 0; font-size: 1.05rem;">Car B</h2>
            <input id="cmdB" style="width:100%; padding:.6rem; border:1px solid #e4e4e7; border-radius:6px;"
                   placeholder="예) KILL:NavigationFeature" />
            <div style="margin-top:.75rem; display:flex; gap:.5rem; align-items:center;">
                <button type="button" id="killB">Send KILL to B</button>
                <span id="statusB" style="font-size:.9rem;" aria-live="polite"></span>
            </div>
        </section>
    </div>

    <script>
        (function () {
            // Spring에서 띄우면 같은 origin(예: http://localhost:18080). 파일로 직접 열면 API만 18080으로 보냄.
            var API_BASE = (window.location.protocol === 'file:') ? 'http://localhost:18080' : '';

            async function sendKill(car, command, btn, statusEl) {
                if (!window.confirm('정말 종료 명령을 보내시겠습니까?')) return;

                btn.disabled = true;
                statusEl.textContent = '전송 중…';
                statusEl.className = '';

                try {
                    const res = await fetch(API_BASE + '/api/system/kill', {
                        method: 'POST',
                        headers: {
                            'Accept': 'application/json',
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({ car: car, command: command })
                    });
                    const body = await res.json().catch(function () { return {}; });
                    if (res.ok) {
                        statusEl.textContent = (body && body.message) ? body.message : '접수됨';
                        statusEl.className = 'ok';
                    } else {
                        statusEl.textContent = '오류: HTTP ' + res.status;
                        statusEl.className = 'err';
                    }
                } catch (e) {
                    statusEl.textContent = '네트워크 오류: ' + (e && e.message ? e.message : e);
                    statusEl.className = 'err';
                } finally {
                    btn.disabled = false;
                }
            }

            const cmdA = document.getElementById('cmdA');
            const cmdB = document.getElementById('cmdB');
            const killA = document.getElementById('killA');
            const killB = document.getElementById('killB');
            const statusA = document.getElementById('statusA');
            const statusB = document.getElementById('statusB');

            killA.addEventListener('click', function () {
                sendKill('A', cmdA.value, killA, statusA);
            });
            killB.addEventListener('click', function () {
                sendKill('B', cmdB.value, killB, statusB);
            });
        })();
    </script>
</body>
</html>
