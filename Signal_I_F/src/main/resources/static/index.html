<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>시스템 제어 — KILL</title>
    <style>
        :root {
            font-family: system-ui, sans-serif;
            color: #1a1a1a;
            background: #f4f4f5;
        }
        body {
            max-width: 32rem;
            margin: 3rem auto;
            padding: 0 1rem;
        }
        h1 { font-size: 1.25rem; }
        p { color: #52525b; line-height: 1.5; }
        button {
            background: #b91c1c;
            color: #fff;
            border: none;
            padding: 0.65rem 1.25rem;
            border-radius: 6px;
            font-size: 1rem;
            cursor: pointer;
        }
        button:hover { background: #991b1b; }
        button:disabled { opacity: 0.6; cursor: not-allowed; }
        #status { margin-top: 1rem; font-size: 0.9rem; }
        .ok { color: #15803d; }
        .err { color: #b91c1c; }
        .actionRow {
            margin-top: .75rem;
            display: flex;
            gap: .5rem;
            align-items: flex-start;
        }
        .statusText {
            flex: 1 1 auto;
            min-width: 0;
            font-size: .9rem;
            line-height: 1.35;
            white-space: normal;
            overflow-wrap: anywhere;
            min-height: 2.4em; /* keep card from jittering on 2-line messages */
        }
    </style>
</head>
<body>
    <h1>MQTT Kill Switch (Web)</h1>
    <p>Spring Boot가 MQTT로 <code>/sdv/vehicle/&lt;vehicleId&gt;/control</code>에 <code>KILL_SWITCH</code>를 publish하고, 차량(또는 mock vehicle)이 <code>/sdv/vehicle/&lt;vehicleId&gt;/telemetry</code>로 ACK를 publish하면 완료로 표시됩니다.</p>

    <!--
      전체 데이터 흐름 (주석):
      1) HTML: car 선택(=vehicleId 변환) + targetFeature 입력 + 버튼 클릭
      2) JS fetch: POST /api/v1/control/kill-switch (JSON: { vehicleId, targetFeature, timeoutMs })
      3) Spring: MQTT publish (/sdv/vehicle/<vehicleId>/control)
      4) Vehicle: telemetry ACK publish (/sdv/vehicle/<vehicleId>/telemetry)
      5) Spring: telemetry subscribe로 ACK 수신 → REST completed
    -->
    <div style="display:grid; gap: 1rem; margin-top: 1rem;">
        <section style="background:#fff; padding: 1rem; border-radius: 10px; box-shadow: 0 1px 4px rgba(0,0,0,0.08);">
            <div style="display:flex; align-items:center; justify-content:space-between; gap:.75rem;">
                <h2 style="margin:0; font-size: 1.05rem;">Target</h2>
                <label style="display:flex; align-items:center; gap:.5rem; color:#52525b; font-size:.9rem;">
                    <span>carId</span>
                    <select id="carSelect" style="padding:.45rem .55rem; border:1px solid #e4e4e7; border-radius:6px; background:#fff;">
                        <option value="car_1">car_1</option>
                        <option value="car_2">car_2</option>
                        <option value="car_3">car_3</option>
                        <option value="car_4">car_4</option>
                        <option value="car_5">car_5</option>
                        <option value="car_6">car_6</option>
                        <option value="car_7">car_7</option>
                        <option value="car_8">car_8</option>
                        <option value="car_9">car_9</option>
                        <option value="car_10">car_10</option>
                    </select>
                </label>
            </div>

            <div style="margin-top:.65rem; display:flex; flex-wrap:wrap; gap:.4rem;">
                <button type="button" class="quickCar" data-car="car_1" style="background:#e4e4e7; color:#111827;">1</button>
                <button type="button" class="quickCar" data-car="car_2" style="background:#e4e4e7; color:#111827;">2</button>
                <button type="button" class="quickCar" data-car="car_3" style="background:#e4e4e7; color:#111827;">3</button>
                <button type="button" class="quickCar" data-car="car_4" style="background:#e4e4e7; color:#111827;">4</button>
                <button type="button" class="quickCar" data-car="car_5" style="background:#e4e4e7; color:#111827;">5</button>
                <button type="button" class="quickCar" data-car="car_6" style="background:#e4e4e7; color:#111827;">6</button>
                <button type="button" class="quickCar" data-car="car_7" style="background:#e4e4e7; color:#111827;">7</button>
                <button type="button" class="quickCar" data-car="car_8" style="background:#e4e4e7; color:#111827;">8</button>
                <button type="button" class="quickCar" data-car="car_9" style="background:#e4e4e7; color:#111827;">9</button>
                <button type="button" class="quickCar" data-car="car_10" style="background:#e4e4e7; color:#111827;">10</button>
            </div>

            <div style="margin-top:.75rem; display:grid; gap:.5rem;">
                <label style="display:flex; align-items:center; justify-content:space-between; gap:.75rem; color:#52525b; font-size:.9rem;">
                    <span>vehicleId</span>
                    <code id="vehicleIdPreview" style="color:#111827;">001</code>
                </label>
                <input id="targetFeature" style="width:100%; padding:.6rem; border:1px solid #e4e4e7; border-radius:6px;"
                       placeholder="예) AdasFeature_B"
                       autocomplete="off" autocapitalize="off" spellcheck="false" />
                <input id="timeoutMs" style="width:100%; padding:.6rem; border:1px solid #e4e4e7; border-radius:6px;"
                       placeholder="timeoutMs (기본 5000)"
                       inputmode="numeric" />
            </div>
            <div class="actionRow">
                <button type="button" id="killBtn">Send KILL_SWITCH</button>
                <span id="status" class="statusText" aria-live="polite"></span>
            </div>
        </section>
    </div>

    <script>
        (function () {
            function parseCarNumber(carId) {
                var m = String(carId || '').match(/^car_(\\d+)$/);
                if (!m) return null;
                return parseInt(m[1], 10);
            }

            function carIdToVehicleId(carId) {
                // Demo convention: car_1 -> "001", car_10 -> "010"
                var n = parseCarNumber(carId);
                if (!n || n < 1) return '001';
                var s = String(n);
                while (s.length < 3) s = '0' + s;
                return s;
            }

            async function sendKillSwitch(vehicleId, targetFeature, timeoutMs, btn, statusEl) {
                if (!window.confirm('정말 종료 명령을 보내시겠습니까?')) return;

                btn.disabled = true;
                statusEl.textContent = '전송 중…';
                statusEl.className = '';

                try {
                    var body = {
                        vehicleId: String(vehicleId || '').trim(),
                        targetFeature: String(targetFeature || '').trim()
                    };
                    var t = String(timeoutMs || '').trim();
                    if (t) {
                        var n = parseInt(t, 10);
                        if (!isNaN(n) && n > 0) body.timeoutMs = n;
                    }

                    const res = await fetch('/api/v1/control/kill-switch', {
                        method: 'POST',
                        headers: {
                            'Accept': 'application/json',
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify(body)
                    });
                    const resp = await res.json().catch(function () { return {}; });
                    if (res.ok) {
                        var st = (resp && resp.status) ? resp.status : 'OK';
                        var detail = (resp && resp.detail) ? resp.detail : '';
                        statusEl.textContent = 'completed=' + String(resp && resp.completed) + ' status=' + st + (detail ? (' / ' + detail) : '');
                        statusEl.className = (String(resp && resp.completed) === 'true') ? 'ok' : '';
                    } else {
                        var errText = '오류: HTTP ' + res.status;
                        if (resp && resp.error) {
                            errText = resp.error;
                        }
                        statusEl.textContent = errText;
                        statusEl.className = 'err';
                    }
                } catch (e) {
                    statusEl.textContent = '네트워크 오류: ' + (e && e.message ? e.message : e);
                    statusEl.className = 'err';
                } finally {
                    btn.disabled = false;
                }
            }

            const carSelect = document.getElementById('carSelect');
            const vehicleIdPreview = document.getElementById('vehicleIdPreview');
            const targetFeature = document.getElementById('targetFeature');
            const timeoutMs = document.getElementById('timeoutMs');
            const killBtn = document.getElementById('killBtn');
            const status = document.getElementById('status');

            function setCar(carId) {
                if (!carSelect) return;
                carSelect.value = carId;
                if (vehicleIdPreview) {
                    vehicleIdPreview.textContent = carIdToVehicleId(carId);
                }
            }

            document.querySelectorAll('.quickCar').forEach(function (btn) {
                btn.addEventListener('click', function () {
                    const car = btn.getAttribute('data-car');
                    if (car) setCar(car);
                });
            });

            if (carSelect) {
                carSelect.addEventListener('change', function () {
                    setCar(carSelect.value);
                });
                setCar(carSelect.value);
            }

            killBtn.addEventListener('click', function () {
                const car = carSelect ? carSelect.value : 'car_1';
                const vehicleId = carIdToVehicleId(car);
                sendKillSwitch(vehicleId,
                    targetFeature ? targetFeature.value : '',
                    timeoutMs ? timeoutMs.value : '',
                    killBtn,
                    status);
            });
        })();
    </script>
</body>
</html>
