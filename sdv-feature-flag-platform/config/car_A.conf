# SDV Feature Flag Platform Configuration (car_A)
#
# car_A runs on port 50051 and seeds non-car-line binaries with ab_mode A.

address 0.0.0.0:50051
ab_mode A

# Feature Communication
communication EventBusHost

# Center Communication (Daemons)
communication DataCollector
communication SignalReceiver
communication SignalSender

# Features — A-line only
feature WatchDog
feature NavigationFeature_A
feature NavigationFeature_A_Shadow
feature AdasFeature_A
feature AdasFeature_A_Shadow
feature EvEnergyFeature_A
feature EvEnergyFeature_A_Shadow
feature FeatureEvaluator
