<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SDV Mapbox Cockpit</title>
  <link href="https://api.mapbox.com/mapbox-gl-js/v3.6.0/mapbox-gl.css" rel="stylesheet" />
  <script src="https://api.mapbox.com/mapbox-gl-js/v3.6.0/mapbox-gl.js"></script>
  <script src="qrc:/mapbox/vendor/three.min.js"></script>
  <script src="qrc:///qtwebchannel/qwebchannel.js"></script>
  <style>
    html, body, #map { margin: 0; padding: 0; width: 100%; height: 100%; background: #b8c4d0; }
    body.live-nav, body.live-nav #map { background: #c5d0dc; }
    #windshield {
      pointer-events: none;
      position: absolute;
      inset: 0;
      z-index: 1;
      opacity: 1;
      background:
        linear-gradient(to bottom, rgba(3,7,17,0.15) 0%, transparent 16%, transparent 48%, rgba(3,7,17,0.45) 72%, rgba(3,7,17,0.75) 100%),
        radial-gradient(ellipse 92% 72% at 50% 52%, transparent 28%, rgba(0,0,0,0.55) 100%);
    }
    body.sim-drive #windshield {
      background:
        linear-gradient(to bottom, rgba(3,7,17,0.08) 0%, transparent 12%, transparent 62%, rgba(3,7,17,0.2) 78%, rgba(3,7,17,0.92) 100%),
        radial-gradient(ellipse 118% 90% at 50% 62%, transparent 48%, rgba(0,0,0,0.28) 100%);
    }
    #dash-sill {
      pointer-events: none;
      position: absolute;
      left: 6%;
      right: 6%;
      bottom: 0;
      height: 72px;
      z-index: 1;
      border-radius: 48% 48% 0 0 / 28% 28% 0 0;
      background: linear-gradient(to top, rgba(8,12,22,0.96) 35%, rgba(8,12,22,0.55) 70%, transparent);
      box-shadow: 0 -8px 32px rgba(0,0,0,0.45);
    }
    body.sim-drive #dash-sill {
      left: 4%;
      right: 4%;
      height: 96px;
      border-radius: 52% 52% 0 0 / 32% 32% 0 0;
      background: linear-gradient(to top, rgba(6,10,20,0.98) 30%, rgba(8,12,22,0.72) 65%, transparent);
      box-shadow: 0 -12px 40px rgba(0,0,0,0.55);
    }
    #banner {
      display: none; position: absolute; z-index: 2; top: 10px; left: 50%; transform: translateX(-50%);
      background: rgba(15,23,42,0.94); color: #fbbf24; padding: 8px 12px; border-radius: 8px;
      font: 12px 'Segoe UI', sans-serif; border: 1px solid #f59e0b;
    }
  </style>
</head>
<body>
  <div id="banner">Set MAPBOX_TOKEN environment variable.</div>
  <div id="map-build-tag" style="position:absolute;left:50%;top:42%;transform:translate(-50%,-50%);z-index:4;padding:10px 16px;border-radius:10px;background:rgba(0,0,0,0.75);color:#4ade80;font:bold 18px 'Segoe UI',sans-serif;letter-spacing:1px;">COCKPIT MAP v15</div>
  <div id="map"></div>
  <div id="lane-count-label" style="display:none;position:absolute;left:20px;bottom:22px;z-index:2;color:#fff;font:600 14px 'Segoe UI',system-ui,sans-serif;padding:6px 12px;border-radius:8px;background:rgba(15,23,42,0.72);border:1px solid rgba(255,255,255,0.2);pointer-events:none;">3차선 (편도)</div>
  <div id="live-nav-label" style="display:none;position:absolute;right:20px;bottom:22px;z-index:2;color:#fff;font:600 15px 'Segoe UI',system-ui,sans-serif;letter-spacing:0.02em;text-shadow:0 1px 6px rgba(0,0,0,0.45);pointer-events:none;">3D Live Navigation</div>
  <div id="windshield" aria-hidden="true"></div>
  <div id="dash-sill" aria-hidden="true"></div>
  <script src="qrc:/mapbox/bridge.js"></script>
  <script src="qrc:/mapbox/route-snap.js"></script>
  <script src="qrc:/mapbox/vehicle-layer.js"></script>
  <script src="qrc:/mapbox/mapbox-scene.js"></script>
  <script>SdvMapbox.bootMain();</script>
</body>
</html>
